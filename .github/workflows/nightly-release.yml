name: Nightly Release APK

on:
  schedule:
    # Preserve the Flutter workflow's midnight IST schedule (18:30 UTC).
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || secrets.BACKEND_URL || 'https://weathergpt-backend.vercel.app' }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. Nightly releases require the original release signing key."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/weathergpt-release.keystore"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: Set nightly version
        run: |
          set -euo pipefail
          STAMP=$(TZ=Asia/Kolkata date +%Y%m%d)
          # Epoch minutes exceed old Flutter run-number versions and survive workflow replacement.
          echo "ANDROID_VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
          echo "APP_VERSION=1.0.0-nightly.$STAMP" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=nightly-$STAMP-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Generate Android project
        run: bunx expo prebuild -p android --no-install
      - name: Configure release signing (no debug-key fallback)
        run: node scripts/configure-android-release.cjs
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify signature and prepare direct download
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs release.apk
          sha256sum release.apk > release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: weathergpt-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release.apk
            release.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish nightly GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release.apk release.apk.sha256 \
            --target "$GITHUB_SHA" --title "WeatherGPT $APP_VERSION" --latest \
            --notes "Standalone Android nightly from commit $GITHUB_SHA. Download release.apk directly on your phone and install it. Signed with the configured release key; no Metro server is needed. SHA-256 checksum is included."
      - name: Remove signing material
        if: always()
        run: rm -f "$KEYSTORE_PATH"

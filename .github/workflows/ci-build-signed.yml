name: CI Build Signed APK

# Per-commit judge build. Publishes the raw `release.apk` ONLY — no zip, no
# AAB. (GitHub wraps Action *artifacts* in a .zip on download; judges who want
# a direct no-extract download should use the dated APK on the Releases page,
# published daily by nightly-release.yml.)
#
# Expo/RN port of the original Flutter workflow: `expo prebuild` regenerates
# android/ from app.json, then a small Python patch swaps the release
# buildType's signingConfig to a real keystore when the KEYSTORE_* secrets
# exist (base64-decoded release keystore). Without them the build falls back
# to Expo's generated debug keystore — installable, just not Play-signed.
#
# Step order matters for caching: prebuild runs before setup-java(cache:
# gradle) so the cache key can hash the generated gradle-wrapper.properties.

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Shared secret for the backend's X-Backend-Secret check (empty = none); inlined into the JS bundle.
      EXPO_PUBLIC_BACKEND_SECRET: ${{ secrets.BACKEND_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native Android project (expo prebuild)
        run: bunx expo prebuild -p android --no-install

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Cache React Native native build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/native
            ~/.gradle/build-cache-1
          key: ${{ runner.os }}-rn-native-${{ hashFiles('bun.lock', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-rn-native-

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret — will sign with the Expo debug keystore (dev fallback)."
          else
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          fi

      # Same helper as the nightly: adds signingConfigs.release (env-driven, no
      # passwords in Gradle files) and points the release build type at it.
      - name: Point release signing at the decoded keystore
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: node scripts/configure-android-release.cjs

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Prepare APK artifact (release.apk only)
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk release.apk
          ls -la release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: weathergpt-signed-${{ github.sha }}
          path: release.apk
          retention-days: 30

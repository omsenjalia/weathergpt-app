name: Android Compile Check

# Proves the Expo React Native app still compiles as a real Android app:
# generates the native Gradle project with `expo prebuild` and assembles a
# debug APK. Runs on every PR and push to main/develop.

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native Android project (expo prebuild)
        run: bunx expo prebuild -p android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weathergpt-rn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

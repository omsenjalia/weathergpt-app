name: Android Compile Check

# Proves the Expo React Native app still compiles as a real Android app:
# generates the native Gradle project with `expo prebuild` and assembles a
# debug APK. Runs on every PR and push to main/develop.
#
# Step order matters for caching: `expo prebuild` MUST run BEFORE
# actions/setup-java(cache: gradle), so the gradle-wrapper.properties file the
# cache key hashes already exists when setup-java saves/restores. That lets a
# single cache entry persist the compiled native libraries (react-native
# .so/.aar, CMake build dirs) between runs — the dominant cost of the ~13 min
# cold build.

concurrency:
  group: android-compile-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-bun only caches the Bun binary, so cache the package store
      # explicitly: keyed on the lockfile, which rarely changes.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generate the native android/ project FIRST so that:
      # 1. setup-java's gradle cache key (below) can hash the freshly
      #    generated gradle-wrapper.properties, and
      # 2. its cached entry (incl. ~/.gradle/native from the prebuild's gradle
      #    invocation) is restored before the assembleDebug step runs.
      - name: Generate native Android project (expo prebuild)
        run: bunx expo prebuild -p android --no-install

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          # Now valid: android/gradle/wrapper/gradle-wrapper.properties exists.
          cache: gradle

      - name: Cache React Native native build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/native
            ~/.gradle/build-cache-1
          key: ${{ runner.os }}-rn-native-${{ hashFiles('bun.lock', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-rn-native-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weathergpt-rn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

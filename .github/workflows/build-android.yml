name: Build Android APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Create environment file
        run: echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" > .env
      - name: Install dependencies
        run: flutter pub get
      - name: Run analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test --timeout 30s
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build unsigned release APK
        run: flutter build apk --release --no-obfuscate
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weathergpt-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: weathergpt-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Build App Bundle
        run: flutter build appbundle --release
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: weathergpt-bundle-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

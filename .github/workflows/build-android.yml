name: Build Android APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {java-version: '17', distribution: temurin}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.24.0', channel: stable, cache: true}
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - run: echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" > .env
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build apk --release --no-obfuscate
      - uses: actions/upload-artifact@v4
        with: {name: weathergpt-debug-${{ github.sha }}, path: build/app/outputs/flutter-apk/app-debug.apk, retention-days: 14}
      - uses: actions/upload-artifact@v4
        with: {name: weathergpt-release-${{ github.sha }}, path: build/app/outputs/flutter-apk/app-release.apk, retention-days: 30}
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with: {name: weathergpt-bundle-${{ github.sha }}, path: build/app/outputs/bundle/release/app-release.aab, retention-days: 30}

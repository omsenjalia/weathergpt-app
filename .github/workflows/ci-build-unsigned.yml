name: CI Build Unsigned APK

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  unsigned-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
          cache-key: flutter-3.44.0-stable
          pub-cache-key: flutter-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache pub + Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-apk-unsigned-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-apk-unsigned-
            ${{ runner.os }}-android-

      - name: Create environment file
        run: |
          URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$URL" ]; then URL="https://placeholder.onrender.com"; fi
          echo "BACKEND_URL=$URL" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned release APK
        env:
          SIGNING_MODE: unsigned
        run: flutter build apk --release --no-obfuscate

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: weathergpt-unsigned-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

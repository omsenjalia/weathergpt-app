name: CI Test

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
          cache-key: flutter-3.44.0-stable
          pub-cache-key: flutter-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-test-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-
            ${{ runner.os }}-flutter-

      - name: Create environment file
        run: echo "BACKEND_URL=https://placeholder.onrender.com" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test --timeout 30s

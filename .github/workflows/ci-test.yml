name: CI Test

# CI gate for the React Native port: strict typecheck + unit tests.
# (The Android Compile Check workflow separately proves native compilation.)

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc strict)
        run: bun run typecheck

      - name: Unit tests (vitest)
        # `bun run test` executes `vitest run` (which applies the RN/Expo test
        # aliases in vitest.config.ts); `bun test` would bypass them.
        run: bun run test

      - name: Export production bundles (catch native dependency and Metro regressions)
        run: bunx expo export --platform all

      - name: Comment on PR when the gate fails
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "❌ CI Test failed (typecheck, unit tests or production bundles). Check the Actions run for details."
            });
